# CodeRabbit-configuratie voor Z.kracht-repo's. Kopieer naar de root van de
# repo als .coderabbit.yaml. Onze standaarden staan in docs/ en CLAUDE.md;
# CodeRabbit leest die mee via path_instructions.
#
# Schema: https://docs.coderabbit.ai/reference/configuration
language: nl-NL

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - claude/main
  path_filters:
    # Referentiepagina's van de reglr-template: niet onze code, niet reviewen
    - "!**/(layout-pages)/**"
    - "!**/(no-layout-pages)/**"
    - "!**/node_modules/**"
    - "!**/*.lock"
    - "!**/package-lock.json"
  path_instructions:
    - path: "**/*"
      instructions: |
        Beoordeel tegen de Z.kracht-standaarden: CLAUDE.md en docs/*.md van deze repo
        (geladen via knowledge_base.code_guidelines). Schrijf in het Nederlands.
        Blokkerend (request changes) bij:
        - secrets, tokens of wachtwoorden in code of config
        - SQL-injectie, XSS, SSRF, path traversal, onveilige deserialisatie
        - een /admin-route zonder autorisatiecheck aan de serverkant
        - wachtwoord-authenticatie: login is altijd een verificatiecode via Zeptomail
        - een Docker-poortmapping zonder 127.0.0.1 (Docker omzeilt UFW; de poort staat dan open op internet)
        - e-mail via iets anders dan Zeptomail, betalingen via iets anders dan Mollie
        - emoji als icoon in de UI; icons zijn SVG uit Lucide of Heroicons
        - een .env of ander secret-bestand dat in git terechtkomt
        Wijs op, maar blokkeer niet: ontbrekende tests, debug-restanten, dode code,
        magic numbers, en afwijkingen van de patronen in de omringende code.
    - path: "**/docker-compose*.yml"
      instructions: |
        Elke ports-mapping moet beginnen met 127.0.0.1:. Een mapping als "${DB_PORT}:5432"
        of "4001:8080" is een blokkerende fout. In docker-compose.yml (productie) en
        docker-compose.staging.yml moeten ook de tijdzone-mounts aanwezig zijn
        (/usr/share/zoneinfo/Europe/Amsterdam en /etc/timezone); in dev-, test- en
        local-compose niet verplicht.
    - path: "**/Jenkinsfile"
      instructions: |
        Elke 'docker compose' met docker-compose.test.yml moet '-p ${PROJECT_NAME}-test' hebben,
        anders ruimt de test-cleanup de staging-deploy op. Blokkerend.
    - path: "**/Dockerfile*"
      instructions: |
        Base images met een expliciete tag; geen :latest. Geen secrets via ARG of ENV.
        Geen COPY van .env.
    - path: "src/app/admin/**"
      instructions: |
        Elke route hier heeft een serverkant-check op role === 'admin'. Een check alleen
        in de UI telt niet. Blokkerend als die ontbreekt.

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
  code_guidelines:
    enabled: true
    filePatterns:
      - files: "CLAUDE.md"
        applyTo: "**/*"
      - files: "docs/*.md"
        applyTo: "**/*"
