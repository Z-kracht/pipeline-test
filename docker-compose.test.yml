services:
  app:
    image: zkracht/pipeline-test:${IMAGE_TAG:-latest}
    # Geen gepubliceerde poort: de test-runner praat via het eigen netwerk
    # (http://app:3000), en 3099 is van de staging-app (HAG-49).
    environment:
      - NODE_ENV=test
      - PORT=3000
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  test-runner:
    image: zkracht/pipeline-test:${IMAGE_TAG:-latest}
    command: sh -c "sleep 5 && node test.js"
    environment:
      - TEST_URL=http://app:3000
    networks:
      - app-network
    depends_on:
      app:
        condition: service_healthy

networks:
  # Eigen netwerk per test-run, NIET het gedeelde externe app-network: daar heten
  # meerdere containers 'app' (regelaar, yuki, maxado, ...), waardoor http://app:3000
  # soms een andere app raakte (307, 'Title not found').
  app-network:
    driver: bridge
